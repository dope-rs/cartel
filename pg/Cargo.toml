[package]
name = "cartel-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Async PostgreSQL driver for the dope runtime"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cartel-core.workspace = true
o3.workspace = true
dope.workspace = true
dope-fiber.workspace = true
cartel-gen.workspace = true
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
base64 = { version = "0.23", default-features = false }
stringprep = "0.1.5"
unicode-normalization = "0.1.25"
zeroize = "1.9.1"
subtle = { version = "2.6", default-features = false }
pin-project.workspace = true

[dev-dependencies]
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
dope-test.workspace = true
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

[lib]
test = false
doctest = false
